<script language="JavaScript">
VIH_BackColor = "palegreen";

<script language="JavaScript" src="https://scripts.hashemian.com/js/visitorIPHOST.js.php"></script>

    <script>
        // Use the native Fetch API to call the geolocation provider
        fetch('https://ipapi.co/json/')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json(); // Parse the response stream into JSON
            })
            .then(data => {
                // Destructure the required location data from the API response
                const { city, region, country_name, ip } = data;
                
                // Display the location data inside the target HTML element
                document.getElementById('location-output').innerHTML = `
                    <strong>IP:</strong> ${ip}<br>
                    <strong>City:</strong> ${city}<br>
                    <strong>Region:</strong> ${region}<br>
                    <strong>Country:</strong> ${country_name}
                `;
                document.getElementById('location-output').classList.remove('loading');
            })
            .catch(error => {
                console.error('Error fetching IP data:', error);
                document.getElementById('location-output').innerText = 'Failed to load location data.';
            });
    </script>
  </body>  
</html>
